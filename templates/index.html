<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0c11" />
  <meta name="description" content="Simulador narrativo de decisiones sobre la vida adulta en Paraguay." />
  <title>Pathraguay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- archivo variable: un solo recurso cubre los cuatro roles tipograficos -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css?v=4" />
</head>
<body>

<main id="game">

  <!-- seleccion de clase, se oculta al empezar la partida -->
  <section id="start-screen" class="start-screen" aria-labelledby="start-title">
    <p class="start-marca">Pathraguay</p>
    <h1 id="start-title" class="start-title">Elige tu Origen</h1>
    <div id="clases-container" class="clases-container" role="list"></div>
  </section>

  <!-- cierre de partida -->
  <div id="gameover-overlay" role="dialog" aria-modal="true" aria-labelledby="go-title" aria-hidden="true">
    <div id="gameover-box">
      <div id="go-icon" aria-hidden="true">💀</div>
      <h2 id="go-title">Fin del juego</h2>
      <div id="go-rule" aria-hidden="true"></div>
      <p id="go-msg"></p>
      <p id="go-stat-label"></p>
      <button id="go-restart" type="button">↺ Intentar de nuevo</button>
    </div>
  </div>

  <!-- atributos del jugador -->
  <section id="stats-block" aria-label="Atributos" aria-live="polite">
    <div class="stat-row s-salud" id="row-salud">
      <div class="stat-icon" aria-hidden="true">🫀</div>
      <div class="stat-name">Salud</div>
      <div class="stat-bar-bg">
        <div class="stat-bar-fill" id="ui-salud"></div>
      </div>
      <div class="stat-val" id="val-salud">72%</div>
      <div class="delta-badge" id="d-salud" aria-hidden="true"></div>
    </div>

    <div class="stat-row s-intelecto" id="row-intelecto">
      <div class="stat-icon" aria-hidden="true">📚</div>
      <div class="stat-name">Intelecto</div>
      <div class="stat-bar-bg">
        <div class="stat-bar-fill" id="ui-intelecto"></div>
      </div>
      <div class="stat-val" id="val-intelecto">58%</div>
      <div class="delta-badge" id="d-intelecto" aria-hidden="true"></div>
    </div>

    <div class="stat-row s-laboral" id="row-laboral">
      <div class="stat-icon" aria-hidden="true">💼</div>
      <div class="stat-name">Laboral</div>
      <div class="stat-bar-bg">
        <div class="stat-bar-fill" id="ui-laboral"></div>
      </div>
      <div class="stat-val" id="val-laboral">46%</div>
      <div class="delta-badge" id="d-laboral" aria-hidden="true"></div>
    </div>

    <div class="stat-row s-social" id="row-social">
      <div class="stat-icon" aria-hidden="true">🗣</div>
      <div class="stat-name">Social</div>
      <div class="stat-bar-bg">
        <div class="stat-bar-fill" id="ui-social"></div>
      </div>
      <div class="stat-val" id="val-social">61%</div>
      <div class="delta-badge" id="d-social" aria-hidden="true"></div>
    </div>

    <div class="stat-row s-dinero" id="row-dinero">
      <div class="stat-icon" aria-hidden="true">💸</div>
      <div class="stat-name">Dinero</div>
      <div class="stat-bar-bg"></div>
      <div class="stat-val" id="ui-dinero">₲ 1.250.000</div>
      <div class="delta-badge" id="d-dinero" aria-hidden="true"></div>
    </div>
  </section>

  <!-- carta actual -->
  <section id="card-area" aria-label="Situacion actual">
    <div id="card-inner">
      <div class="hud-sep" aria-hidden="true"></div>

      <div id="name-block">
        <div id="npc-tag">La vida puede tener giros inesperados...</div>
        <div id="npc-name"></div>
      </div>

      <div id="card-image">
        <img id="ui-card-img" src="/static/img/predeterminado.webp" alt="" decoding="async" />
      </div>

      <div id="interactive-block">
        <button id="btn-izq" class="nav-btn" type="button" aria-label="Elegir la opcion de la izquierda">❮</button>
        <p id="situation-text" aria-live="polite"></p>
        <button id="btn-der" class="nav-btn" type="button" aria-label="Elegir la opcion de la derecha">❯</button>
      </div>
    </div>
  </section>

  <!-- alerta de estres, se activa si el servidor envia una alerta -->
  <div id="panic-overlay" role="alertdialog" aria-labelledby="panic-title" aria-hidden="true">
    <div id="panic-box">
      <div id="panic-icon" aria-hidden="true">⚠️</div>
      <h2 id="panic-title">zona crítica</h2>
      <div id="panic-rule" aria-hidden="true"></div>
      <p id="panic-msg"></p>
    </div>
  </div>

  <p id="log" aria-live="polite"></p>

</main>

<script src="/static/app.js?v=4"></script>
</body>
</html>
